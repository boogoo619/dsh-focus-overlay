name: Publish to npm
on:
  push:
    tags:
      - 'v*'
permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish # OIDC: no NODE_AUTH_TOKEN needed (trusted publisher)
