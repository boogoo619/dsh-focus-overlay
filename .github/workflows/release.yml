name: Publish to npm
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Decode OIDC claims (diagnostic)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          echo "$TOKEN" | jq -R 'split(".") | .[1] | @base64d | fromjson | {sub, repository, repository_owner, repository_visibility, workflow, workflow_ref, job_workflow_ref, ref, event_name, aud}'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --loglevel verbose
